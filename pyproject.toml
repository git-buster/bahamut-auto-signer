[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bahamut-auto-signer"
version = "0.1.0"
description = "Bahamut check-in, Cookie export, and GitHub Secret refresh tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
]

[project.scripts]
baha-auto-signer = "scripts.bahamut_signin:main"
bahamut-cookie-exporter = "bahamut_secret_refresher.export_bahamut_cookies:main"
bahamut-secret-refresher = "bahamut_secret_refresher.update_actions_secret:main"

[project.optional-dependencies]
export = ["DrissionPage"]

[tool.setuptools.packages.find]
include = ["scripts*", "bahamut_secret_refresher*"]
